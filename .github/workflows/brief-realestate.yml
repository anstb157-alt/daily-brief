name: 부동산 브리핑

on:
  schedule:
    # KST 08:00 = UTC 23:00 전날. 주식(08:40)보다 40분 먼저 — Pages 커밋 충돌 방지
    - cron: '0 23 * * 0-4'
  workflow_dispatch:

concurrency:
  group: brief-realestate
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: 브리핑 생성·발송
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          RONE_API_KEY: ${{ secrets.RONE_API_KEY }}
          PAGES_BASE_URL: ${{ secrets.PAGES_BASE_URL }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npx tsx src/main.ts realestate

      - name: Pages 커밋
        run: |
          if [ -z "$(git status --porcelain docs state)" ]; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs state
          git commit -m "brief(realestate): $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
