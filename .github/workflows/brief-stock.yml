name: 주식 브리핑

on:
  schedule:
    # KST 08:40 = UTC 23:40 전날. 일~목(UTC) = 월~금(KST)
    # Actions 스케줄은 수십 분 밀릴 수 있어 여유를 둔 값이다.
    - cron: '40 23 * * 0-4'
  workflow_dispatch:

# 같은 도메인의 중복 실행만 막는다. 부동산 워크플로우와는 독립이다.
concurrency:
  group: brief-stock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: 브리핑 생성·발송
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          PAGES_BASE_URL: ${{ secrets.PAGES_BASE_URL }}
          # refresh token 회전용. 없으면 회전만 실패하고 발송은 계속된다.
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npx tsx src/main.ts stock

      - name: Pages 커밋
        run: |
          if [ -z "$(git status --porcelain docs state)" ]; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs state
          git commit -m "brief(stock): $(TZ=Asia/Seoul date +%Y-%m-%d)"
          # 부동산 워크플로우와 10분 간격이지만 밀릴 수 있어 rebase 후 푸시한다
          git pull --rebase origin main
          git push origin HEAD:main
